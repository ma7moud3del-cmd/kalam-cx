<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KALAM CEO Dashboard</title>
<link rel="icon" href="../ims-program/assets/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--plum:#4B154A;--plum2:#79417F;--plum3:#F3E9F3;--yel:#FFC629;--ink:#1d1424;--mut:#6f6476;--line:#e9e1ec;--bg:#faf7fb;--card:#fff;
--g:#1f9d63;--a:#e8a317;--r:#d0384d;--n:#a59dab;--gbg:#e3f5ec;--abg:#fdf1d8;--rbg:#fbe3e7;--nbg:#efedf1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
a{color:inherit}
header{background:linear-gradient(120deg,#2b0a2a,var(--plum) 55%,#6a2a68);color:#fff;padding:18px 24px 0;position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,198,41,.28),transparent 65%)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:relative;z-index:1}
.top img{height:34px;background:#fff;border-radius:8px;padding:4px}
.top h1{font-size:19px;font-weight:700;letter-spacing:.2px}
.top small{display:block;font-weight:400;opacity:.75;font-size:12px}
.meta{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);white-space:nowrap}
.pill.y{background:var(--yel);color:var(--plum);border-color:var(--yel)}
nav{display:flex;gap:4px;margin-top:16px;overflow-x:auto;position:relative;z-index:1;scrollbar-width:none}
nav button{font:600 13px Poppins;color:#fff;opacity:.7;background:none;border:0;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap}
nav button.on{opacity:1;background:var(--bg);color:var(--plum)}
nav button span{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;background:rgba(255,255,255,.18);font-size:11px;margin-right:6px;text-align:center}
nav button.on span{background:var(--yel);color:var(--plum)}
main{max-width:1280px;margin:0 auto;padding:20px 24px 60px}
.scr{display:none}.scr.on{display:block;animation:f .35s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
h2{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--plum2);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2 b{background:var(--plum);color:var(--yel);width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;font-size:11px;letter-spacing:0}
.grid{display:grid;gap:12px}
.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.g5,.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.g5,.g4,.g3,.g2{grid-template-columns:1fr}main{padding:16px}header{padding:14px 16px 0}.meta{margin-left:0}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(75,21,74,.04)}
.card.dark{background:var(--plum);color:#fff;border-color:var(--plum)}
.k{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
.dark .k{color:#e6cfe6}
.big{font-size:34px;font-weight:800;line-height:1.05;margin:6px 0 2px;color:var(--plum)}
.dark .big{color:var(--yel)}
.big.na{font-size:17px;font-weight:700;color:var(--n);letter-spacing:.5px;margin:12px 0 8px}
.sub{font-size:12px;color:var(--mut)}
.dark .sub{color:#ead8ea}
.st{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.5px}
.st:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sV{background:var(--gbg);color:var(--g)}.sP{background:var(--abg);color:#b07605}.sN{background:var(--nbg);color:#7b7381}.sE{background:var(--rbg);color:var(--r)}
.src{font-size:10.5px;color:var(--mut);margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.dark .src{color:#dcc3dc;border-color:rgba(255,255,255,.2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.goal{position:relative;overflow:hidden}
.goal .n{position:absolute;right:10px;top:4px;font-size:48px;font-weight:800;color:var(--plum3)}
.goal h3{font-size:14px;position:relative}
.bar{height:8px;border-radius:99px;background:var(--nbg);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px}
.hatch{background:repeating-linear-gradient(45deg,#e4dfe8 0 6px,#f3f0f5 6px 12px)}
.ring{width:96px;height:96px}
.prio{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.prio:last-child{border:0}
.prio .num{width:30px;height:30px;border-radius:9px;background:var(--plum);color:var(--yel);display:grid;place-items:center;font-weight:800}
.prio b{display:block;font-size:13.5px}
.prio small{color:var(--mut);font-size:11.5px}
.tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--plum3);color:var(--plum);white-space:nowrap}
.cert{display:flex;gap:14px;align-items:center}
.seal{width:64px;height:64px;border-radius:50%;border:3px dashed var(--plum2);display:grid;place-items:center;font-weight:800;color:var(--plum);font-size:12px;text-align:center;flex:none;line-height:1.1}
.seal.gp{border-color:#d0384d;color:#d0384d}
.dark .seal{border-color:var(--yel);color:var(--yel)}
/* heatmap */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{font:600 12px Poppins;border:1px solid var(--line);background:#fff;color:var(--plum);padding:6px 12px;border-radius:99px;cursor:pointer}
.filters button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.heat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:900px){.heat{grid-template-columns:repeat(2,1fr)}}
.cell{border-radius:14px;padding:14px;cursor:pointer;border:2px solid transparent;min-height:112px;display:flex;flex-direction:column;transition:transform .15s}
.cell:hover{transform:translateY(-2px);border-color:var(--plum2)}
.cell.dim{opacity:.22}
.cell h4{font-size:13px;line-height:1.25}
.cell .dei{margin-top:auto;display:flex;gap:4px;padding-top:10px}
.cell .dei span{flex:1;font-size:10px;font-weight:700;text-align:center;border-radius:5px;padding:3px 0;background:rgba(255,255,255,.7);color:#a59dab}.cell .dei span.lP{background:#79417F;color:#fff;opacity:.6}.cell .dei span.lV{background:#4B154A;color:#fff}
.cR{background:var(--rbg)}.cA{background:var(--abg)}.cG{background:var(--gbg)}.cN{background:var(--nbg);color:#6f6476}
.cR h4{color:#9b1f33}.cA h4{color:#8a5c00}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
/* matrix */
.mx{width:100%;border-collapse:separate;border-spacing:6px}
.mx th{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);text-align:left;padding:4px 6px}
.mx td{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;vertical-align:top;font-size:12px}
.mx td.gl{background:var(--plum);color:#fff;font-weight:700;font-size:13px;width:17%}
.mx td.gl small{display:block;color:var(--yel);font-weight:600;font-size:10.5px}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;margin:2px 2px 0 0;background:var(--plum3);color:var(--plum)}
.chip.g{background:#fde7ea;color:#a3283b}.chip.k{background:#fff3cf;color:#7a5600}
@media(max-width:760px){.mxw{overflow-x:auto}.mx{min-width:720px}}
/* flow */
.flow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.step{flex:1;min-width:92px;border-radius:10px;padding:8px;font-size:11.5px;font-weight:600;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2px}
.step small{font-weight:400;font-size:10px;opacity:.8}
.sm{background:#fbe3e7;color:#8e1c2e}.sa{background:#e3f5ec;color:#11683f}.sh{background:var(--plum3);color:var(--plum)}
.arrow{align-self:center;color:var(--plum2);font-weight:800}
/* gantt */
.gantt{display:grid;grid-template-columns:200px 1fr;gap:8px 12px;align-items:center}
@media(max-width:640px){.gantt{grid-template-columns:1fr}}
.gl2 b{display:block;font-size:13px}.gl2 small{color:var(--mut);font-size:11px}
.track{position:relative;height:34px;background:#fff;border:1px solid var(--line);border-radius:10px}
.seg{position:absolute;top:4px;bottom:4px;border-radius:7px;display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;transition:all .4s}
.now{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--yel)}
.opt{border-radius:16px;padding:16px;border:2px solid var(--line);background:#fff;position:relative}
.opt.rec{border-color:var(--plum)}
.opt.rec:after{content:"Recommended";position:absolute;top:-11px;right:14px;background:var(--yel);color:var(--plum);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px}
.lvl{display:flex;gap:3px;margin-top:3px}.lvl i{flex:1;height:7px;border-radius:3px;background:var(--nbg)}.lvl i.on{background:var(--plum2)}
.dec{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.dec:last-child{border:0}
.dec .q{flex:none;width:26px;height:26px;border-radius:50%;background:var(--yel);color:var(--plum);display:grid;place-items:center;font-weight:800;font-size:12px}
/* modal */
.mod{position:fixed;inset:0;background:rgba(29,20,36,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.mod.on{display:flex}
.box{background:#fff;border-radius:18px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.box h3{font-size:18px;color:var(--plum);margin-bottom:6px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin-top:14px;font-size:13px}
.kv dt{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;padding-top:2px}
.x{float:right;border:0;background:var(--plum3);color:var(--plum);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
.foot{margin-top:28px;font-size:11px;color:var(--mut);display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
.btn{font:600 12px Poppins;border:0;background:var(--yel);color:var(--plum);padding:8px 14px;border-radius:99px;cursor:pointer}
svg text{font-family:Poppins}
@media print{nav,.btn{display:none}.scr{display:block!important;page-break-after:always}header{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

document.getElementById('scn').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#scn button').forEach(z=>z.classList.toggle('on',z==b));gantt(+b.dataset.k)};
document.getElementById('flt').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#flt button').forEach(z=>z.classList.toggle('on',z==b));const f=b.dataset.f;document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('dim',f!='all'&&!c.dataset.fw.includes(f)))};

// drill-down
const mod=document.getElementById('mod'),box=document.getElementById('box');
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t){open(t.dataset.a)}else if(e.target==mod||e.target.closest('.x'))mod.classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key=='Escape')mod.classList.remove('on')});
const lvl=x=>x=='N'?'No evidence':x=='P'?'Partly':'Yes';
function open(id){const a=areas.find(z=>z.id==id);
 box.innerHTML=`<button class="x" aria-label="Close">×</button><span class="st ${a.s=='R'?'sE':a.s=='A'?'sP':'sN'}">${a.s=='R'?'Critical gap':a.s=='A'?'Improvement required':'Not assessed'}</span><h3 style="margin-top:8px">${a.t}</h3><div>${a.gap}</div>
 ${a.evid.length?`<ul style="margin:12px 0 0 18px;font-size:13px">${a.evid.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
 <dl class="kv"><dt>Source</dt><dd>${a.src} ${st(a.ev)}</dd><dt>Evidence levels</dt><dd>Documented: ${lvl(a.d)} · Implemented: ${lvl(a.i)} · Experienced: ${lvl(a.e)}</dd><dt>COPC R8.0</dt><dd>${a.copc}</dd><dt>GPTW</dt><dd>${a.gptw}</dd><dt>KALAM Way</dt><dd>${a.kw}</dd><dt>Goals</dt><dd>${a.goal.map(g=>`<span class="chip">Goal ${g} · ${goals[g-1].t}</span>`).join('')}</dd><dt>Recommended</dt><dd>${a.act}</dd><dt>Owner</dt><dd>${a.own}</dd><dt>Target date</dt><dd>Set in Phase 1</dd><dt>Progress</dt><dd><div class="bar hatch" style="width:160px"></div></dd></dl>`;
 mod.classList.add('on')}
</script>
</body>
</html>
